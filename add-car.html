<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List New Vehicle | CarZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark">

    <div class="loader-wrapper">
        <div class="loader"></div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-car-front-fill me-2"></i>CarZone
            </a>
            <div class="ms-auto">
                <a href="dashboard.html" class="btn btn-outline-primary btn-sm me-2">Dashboard</a>
                <a href="index.html" class="btn btn-link text-white text-decoration-none small">Back to Showroom</a>
            </div>
        </div>
    </nav>

    <main class="container my-5 py-5">
        <div class="form-container mx-auto" style="max-width: 800px;">
            <div class="text-center mb-5">
                <div class="mb-3">
                    <i class="bi bi-plus-circle-fill text-primary display-3 shadow-lg"></i>
                </div>
                <h2 class="display-6 fw-bold">New Inventory Entry</h2>
                <p class="text-muted">Enter the technical specifications and imagery of the vehicle.</p>
            </div>
            
            <form id="add-car-form">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="car-name-input" class="form-label small text-muted text-uppercase fw-bold">Model Name</label>
                        <input type="text" class="form-control" id="car-name-input" placeholder="e.g. Aventador SVJ" required>
                    </div>
                    <div class="col-md-6">
                        <label for="car-brand-input" class="form-label small text-muted text-uppercase fw-bold">Make / Brand</label>
                        <input type="text" class="form-control" id="car-brand-input" placeholder="e.g. Lamborghini" required>
                    </div>
                    <div class="col-md-6">
                        <label for="car-price-input" class="form-label small text-muted text-uppercase fw-bold">Price ($)</label>
                        <input type="number" class="form-control" id="car-price-input" placeholder="e.g. 517000" required>
                    </div>
                    <div class="col-md-6">
                        <label for="car-year-input" class="form-label small text-muted text-uppercase fw-bold">Model Year</label>
                        <input type="number" class="form-control" id="car-year-input" placeholder="e.g. 2024" required>
                    </div>
                    <div class="col-12">
                        <label for="car-image-input" class="form-label small text-muted text-uppercase fw-bold">Vehicle Imagery</label>
                        <div class="p-4 rounded-3 border border-dashed border-secondary text-center bg-white bg-opacity-5">
                            <i class="bi bi-cloud-upload fs-1 text-primary mb-3 d-block"></i>
                            <input type="file" id="car-image-input" class="form-control" accept="image/*" required>
                            <p class="small text-muted mt-2 mb-0">High resolution PNG or JPG recommended.</p>
                        </div>
                    </div>
                    <div class="col-12">
                        <label for="car-desc-input" class="form-label small text-muted text-uppercase fw-bold">Detailed Overview</label>
                        <textarea class="form-control" id="car-desc-input" rows="4" placeholder="Performance details, history, and status..."></textarea>
                    </div>
                </div>

                <div class="mt-5 d-flex gap-3">
                    <button type="submit" class="btn btn-primary flex-grow-1 py-3">
                        <i class="bi bi-check2-circle me-2"></i> Register Vehicle
                    </button>
                    <a href="dashboard.html" class="btn btn-outline-secondary py-3 px-4">Discard</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-transparent border-0 py-4">
        <div class="container text-center text-muted">
            <p class="small mb-0">&copy; 2026 CarZone Inventory Management</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
