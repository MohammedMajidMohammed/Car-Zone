<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Car | CarZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-car-front-fill me-2"></i>CarZone
            </a>
            <div class="ms-auto d-flex align-items-center">
                <div id="auth-links" class="d-none">
                    <a href="login.html" class="btn btn-outline-primary btn-sm me-2">Login</a>
                </div>
                <div id="user-links" class="d-flex align-items-center">
                    <span class="navbar-text small me-3 d-none d-md-inline">Logged in as: <strong id="username-display">User</strong></span>
                    <a href="#" id="logout-btn" class="btn btn-outline-danger btn-sm me-2">Logout</a>
                </div>
                <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="form-container" style="max-width: 700px;">
            <div class="text-center mb-4">
                <i class="bi bi-plus-circle-fill text-primary display-4"></i>
                <h2 class="fw-bold mt-2">Add New Car For Sale</h2>
                <p class="text-muted">Fill in the details below to list your car on the showroom.</p>
            </div>
            
            <form id="add-car-form">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="car-name-input" class="form-label">Car Name (Model)</label>
                        <input type="text" class="form-control" id="car-name-input" placeholder="e.g. Model 3" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="car-brand-input" class="form-label">Brand (Make)</label>
                        <input type="text" class="form-control" id="car-brand-input" placeholder="e.g. Tesla" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="car-price-input" class="form-label">Price ($)</label>
                        <input type="number" class="form-control" id="car-price-input" placeholder="e.g. 45000" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="car-year-input" class="form-label">Year</label>
                        <input type="number" class="form-control" id="car-year-input" placeholder="e.g. 2023" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="car-image-input" class="form-label font-weight-bold"><i class="bi bi-image me-2"></i>Select Car Image</label>
                    <input type="file" class="form-control" id="car-image-input" accept="image/*" required>
                    <small class="text-muted">Choose a JPG or PNG from your device.</small>
                </div>

                <div class="mb-4">
                    <label for="car-desc-input" class="form-label">Description</label>
                    <textarea class="form-control" id="car-desc-input" rows="3" placeholder="Describe the car's condition, features, etc."></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary py-3 fw-bold">
                        <i class="bi bi-cloud-arrow-up me-2"></i> Publish Listing
                    </button>
                    <a href="dashboard.html" class="btn btn-link text-muted">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-white py-4 mt-5 border-top">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2026 CarZone – University Student Project</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
