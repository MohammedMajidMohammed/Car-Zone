<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Vehicle | CarZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark">

    <div class="loader-wrapper">
        <div class="loader"></div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-car-front-fill me-2"></i>CarZone
            </a>
            <div class="ms-auto">
                <a href="dashboard.html" class="btn btn-outline-primary btn-sm me-2">Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="container my-5 py-5">
        <div class="form-container mx-auto" style="max-width: 800px;">
            <div class="text-center mb-5">
                <div class="mb-3">
                    <i class="bi bi-pencil-square text-primary display-3"></i>
                </div>
                <h2 class="display-6 fw-bold">Modify Listing</h2>
                <p class="text-muted">Update the specifications or imagery for this inventory item.</p>
            </div>
            
            <form id="edit-car-form">
                <input type="hidden" id="edit-car-id">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="edit-car-name" class="form-label small text-muted text-uppercase fw-bold">Model Name</label>
                        <input type="text" class="form-control" id="edit-car-name" required>
                    </div>
                    <div class="col-md-6">
                        <label for="edit-car-brand" class="form-label small text-muted text-uppercase fw-bold">Make / Brand</label>
                        <input type="text" class="form-control" id="edit-car-brand" required>
                    </div>
                    <div class="col-md-6">
                        <label for="edit-car-price" class="form-label small text-muted text-uppercase fw-bold">Price ($)</label>
                        <input type="number" class="form-control" id="edit-car-price" required>
                    </div>
                    <div class="col-md-6">
                        <label for="edit-car-year" class="form-label small text-muted text-uppercase fw-bold">Model Year</label>
                        <input type="number" class="form-control" id="edit-car-year" required>
                    </div>
                    <div class="col-12">
                        <label for="edit-car-image" class="form-label small text-muted text-uppercase fw-bold">Replace Imagery (Optional)</label>
                        <input type="file" id="edit-car-image" class="form-control" accept="image/*">
                        <small class="text-muted">Leave empty to keep the current high-resolution image.</small>
                    </div>
                    <div class="col-12">
                        <label for="edit-car-desc" class="form-label small text-muted text-uppercase fw-bold">Detailed Overview</label>
                        <textarea class="form-control" id="edit-car-desc" rows="4"></textarea>
                    </div>
                </div>

                <div class="mt-5 d-flex gap-3">
                    <button type="submit" class="btn btn-primary flex-grow-1 py-3">
                        <i class="bi bi-save me-2"></i> Save Changes
                    </button>
                    <a href="dashboard.html" class="btn btn-outline-secondary py-3 px-4">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-transparent border-0 py-5">
        <div class="container text-center text-muted">
            <p class="small mb-0">&copy; 2026 CarZone – Secure Inventory Update</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
