<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Car Details | CarZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-car-front-fill me-2"></i>CarZone
            </a>
            <div class="ms-auto d-flex align-items-center">
                <div id="user-links" class="d-flex align-items-center">
                    <span class="navbar-text small me-3 d-none d-md-inline">Logged in as: <strong id="username-display">User</strong></span>
                    <a href="#" id="logout-btn" class="btn btn-outline-danger btn-sm me-2">Logout</a>
                </div>
                <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="form-container" style="max-width: 700px;">
            <div class="text-center mb-4">
                <i class="bi bi-pencil-square text-primary display-4"></i>
                <h2 class="fw-bold mt-2">Edit Car Information</h2>
                <p class="text-muted">Modify the details of the selected vehicle below.</p>
            </div>
            
            <form id="edit-car-form">
                <input type="hidden" id="edit-car-id">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="edit-car-name" class="form-label">Car Name (Model)</label>
                        <input type="text" class="form-control" id="edit-car-name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="edit-car-brand" class="form-label">Brand (Make)</label>
                        <input type="text" class="form-control" id="edit-car-brand" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="edit-car-price" class="form-label">Price ($)</label>
                        <input type="number" class="form-control" id="edit-car-price" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="edit-car-year" class="form-label">Year</label>
                        <input type="number" class="form-control" id="edit-car-year" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="edit-car-image" class="form-label font-weight-bold"><i class="bi bi-image me-2"></i>Choose New Image (Optional)</label>
                    <input type="file" class="form-control" id="edit-car-image" accept="image/*">
                    <small class="text-muted">Leave empty to keep current image.</small>
                </div>

                <div class="mb-4">
                    <label for="edit-car-desc" class="form-label">Description</label>
                    <textarea class="form-control" id="edit-car-desc" rows="3"></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success py-3 fw-bold">
                        <i class="bi bi-save me-2"></i> Save Changes
                    </button>
                    <a href="dashboard.html" class="btn btn-link text-muted">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-white py-4 mt-5 border-top">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2026 CarZone – University Student Project</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
