<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CarZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-car-front-fill me-2"></i>CarZone
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item" id="auth-links">
                        <a class="nav-link text-primary" href="login.html">Login</a>
                    </li>
                    <li class="nav-item d-none" id="user-links">
                        <a class="nav-link text-danger" href="#" id="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout (<span id="username-display"></span>)</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-white py-5 shadow-sm mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <h1 class="fw-bold mb-0">Management Dashboard</h1>
                <p class="text-muted mb-0">Welcome back! Manage your showroom and listings here.</p>
            </div>
            <a href="add-car.html" class="btn btn-primary d-flex align-items-center">
                <i class="bi bi-plus-lg me-2"></i> Add New Car
            </a>
        </div>
    </header>

    <div class="container mb-5">
        <div class="search-wrapper mb-4 px-3 d-flex align-items-center mx-0" style="max-width: 100%;">
            <i class="bi bi-search text-muted me-2"></i>
            <input type="text" id="search-input" class="form-control" placeholder="Quick filter your listings...">
        </div>

        <h3 class="fw-bold mb-4">Current Listings</h3>
        <div class="row" id="dashboard-list">
        </div>
    </div>

    <footer class="bg-white py-4 mt-5 border-top">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2026 CarZone – University Student Project</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
