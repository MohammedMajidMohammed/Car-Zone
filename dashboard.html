<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CarZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark">

    <div class="loader-wrapper">
        <div class="loader"></div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-car-front-fill me-2"></i>CarZone
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Showroom</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">Admin</a>
                    </li>
                    <li class="nav-item d-none" id="user-links">
                        <a class="nav-link text-danger ms-3" href="#" id="logout-btn">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout (<span id="username-display"></span>)
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="dashboard-header text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Management Hub</h1>
            <p class="lead text-muted mb-4">Control your inventory and showcase your best assets.</p>
            <a href="add-car.html" class="btn btn-primary btn-lg">
                <i class="bi bi-plus-lg me-2"></i> Add New Car
            </a>
        </div>
    </header>

    <div class="container my-5 py-3">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold mb-0">Active Listings</h2>
            <div class="search-wrapper mb-0" style="max-width: 400px; margin: 0;">
                <i class="bi bi-search text-muted me-2"></i>
                <input type="text" id="search-input" class="form-control" placeholder="Quick search inventory...">
            </div>
        </div>

        <div class="row" id="dashboard-list">
            <!-- Listings populated by script.js -->
        </div>
    </div>

    <footer class="mt-5">
        <div class="container text-center text-muted">
            <p class="small">&copy; 2026 CarZone – Dashboard Management</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
