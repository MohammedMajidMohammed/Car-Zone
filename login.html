<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CarZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark d-flex flex-column min-vh-100">

    <div class="loader-wrapper">
        <div class="loader"></div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-car-front-fill me-2"></i>CarZone
            </a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-link text-white text-decoration-none small">Back to Showroom</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center">
        <div class="container">
            <div class="form-container">
                <div class="text-center mb-5">
                    <h2 class="display-6 fw-bold">Welcome Back</h2>
                    <p class="text-muted">Enter your credentials to access your account.</p>
                </div>
                
                <form id="login-form">
                    <div class="mb-4">
                        <label for="email" class="form-label small text-muted text-uppercase fw-bold">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@luxury.com" required>
                    </div>
                    <div class="mb-5">
                        <label for="password" class="form-label small text-muted text-uppercase fw-bold">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-4">
                        Secure Login <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                    <div class="text-center">
                        <p class="small text-muted mb-0">Don't have an account? <a href="register.html" class="text-primary text-decoration-none fw-bold">Create one now</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-transparent border-0 py-4">
        <div class="container text-center">
            <p class="text-muted small mb-0">&copy; 2026 CarZone Secure Login</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
